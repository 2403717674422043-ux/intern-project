<!DOCTYPE html>
<html>
<head>
    <title>Attrition Predictor</title>
</head>
<body>

<h2>Employee Attrition Prediction</h2>

<form action="/predict" method="post">
    Age: <input type="number" name="age"><br><br>
    Monthly Income: <input type="number" name="income"><br><br>
    Years at Company: <input type="number" name="years"><br><br>

    <button type="submit">Predict</button>
</form>

{% if prediction %}
    <h3>Result: {{ prediction }}</h3>
{% endif %}

</body>
</html>
